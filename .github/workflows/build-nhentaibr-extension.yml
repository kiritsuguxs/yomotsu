name: Build Nhentai BR Extension

on:
  push:
    paths:
      - 'extension-nhentaibr/**'
      - '.github/workflows/build-nhentaibr-extension.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Keystore
        env:
          STOREFILEBASE64: ${{ secrets.STOREFILEBASE64 }}
        run: |
          if [ -n "$STOREFILEBASE64" ]; then
            mkdir -p "$RUNNER_TEMP"
            echo "$STOREFILEBASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          fi

      - name: Build APK
        working-directory: ./extension-nhentaibr
        env:
          STOREPASSWORD: ${{ secrets.STOREPASSWORD }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYPASSWORD: ${{ secrets.KEYPASSWORD }}
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nhentaibr-extension-apk
          path: extension-nhentaibr/build/outputs/apk/release/*.apk
