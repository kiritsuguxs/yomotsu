name: Build Blackout Comics Extension

on:
  push:
    branches:
      - extensão
    paths:
      - 'extension-blackoutcomics/**'
      - '.github/workflows/build-blackoutcomics-extension.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        working-directory: ./extension-blackoutcomics
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blackoutcomics-extension-apk
          path: extension-blackoutcomics/build/outputs/apk/release/*.apk
