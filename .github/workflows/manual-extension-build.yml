name: Compilar extensão manualmente

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch que contém a extensão
        required: true
        default: extensão
        type: string
      extension:
        description: Extensão para compilar
        required: true
        default: all
        type: choice
        options:
          - all
          - animeshentai
          - baozinho
          - blackoutcomics
          - blitztoons
          - nhentaibr
          - projectnox
          - saimotv
          - toonlivre
          - watchanimehentai

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
      TARGET_EXTENSION: ${{ inputs.extension }}
    steps:
      - name: Iniciar build
        uses: actions/github-script@v7
        with:
          script: |
            const allExtensions = [
              "animeshentai",
              "baozinho",
              "blackoutcomics",
              "blitztoons",
              "nhentaibr",
              "projectnox",
              "saimotv",
              "toonlivre",
              "watchanimehentai",
            ];
            const targets = process.env.TARGET_EXTENSION === "all"
              ? allExtensions
              : [process.env.TARGET_EXTENSION];

            for (const ext of targets) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: `build-${ext}-extension.yml`,
                ref: process.env.TARGET_BRANCH,
              });
              core.notice(`Build iniciado para ${ext} em ${process.env.TARGET_BRANCH}.`);
            }
